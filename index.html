<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paintball Survival</title>
<style>
:root{--bg:#10141a;--fg:#eef2f7;--mut:#9aa7b8;--card:#1b222c;--acc:#ff7a2f;--blue:#3aa0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
body{display:flex;flex-direction:column;align-items:center;padding:12px}
#wrap{position:relative;width:100%;max-width:900px}
canvas{width:100%;display:block;border-radius:12px;background:#24402b;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,20,.82);border-radius:12px}
.card{background:var(--card);padding:22px 28px;border-radius:14px;text-align:center;max-width:90%}
h1{margin:0 0 4px;font-size:30px;color:var(--acc)}h2{margin:0 0 6px;color:#ff4d4d}
p{color:var(--mut);margin:6px 0}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
button{font:inherit;background:#2a3442;color:var(--fg);border:2px solid transparent;border-radius:8px;padding:8px 14px;cursor:pointer}
button.sel{border-color:var(--acc)}button.go{background:var(--acc);color:#111;font-weight:700;padding:10px 26px}
table{margin:8px auto;border-collapse:collapse}td{padding:2px 14px;text-align:left}td+td{text-align:right;color:var(--acc);font-variant-numeric:tabular-nums}
small{color:var(--mut)}
body{background:radial-gradient(ellipse at 50% 0,#1e2a38,#0a0e14 70%);background-attachment:fixed}
canvas{box-shadow:0 12px 40px rgba(0,0,0,.55);border:2px solid #2c3a4a}
#ov{background:rgba(8,11,16,.74);backdrop-filter:blur(5px)}
.card{padding:28px 34px;border:1px solid #2c3a4a;box-shadow:0 24px 60px rgba(0,0,0,.6);min-width:min(430px,86%);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
h1{font-size:clamp(24px,5vw,36px)}h2{font-size:30px;letter-spacing:2px}
.diffs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
button{transition:transform .1s,background .15s,border-color .15s;font-weight:600}
button:hover{transform:translateY(-1px);background:#364458}button:active{transform:none}
button.sel{background:#3a2a1c;border-color:var(--acc);color:#ffd2b0}
button.go{background:linear-gradient(180deg,#ff944d,#ff6a1f);box-shadow:0 4px 16px rgba(255,106,31,.4);margin-top:6px}
button.go:hover{background:linear-gradient(180deg,#ffa05f,#ff7430)}
.lbl{margin-top:10px;text-transform:uppercase;font-size:12px;letter-spacing:1.5px}
table{width:100%;background:#141a22;border-radius:10px;padding:4px 6px}tr.cur td{color:#fff;font-weight:700}tr.cur td+td{color:#ffb27a}
.stats{display:flex;gap:10px;justify-content:center;margin:14px 0}.stat{background:#141a22;border-radius:10px;padding:10px 16px;min-width:76px}.stat b{display:block;font-size:22px}
.card{max-height:94%;overflow:auto}.how{text-align:left;margin:12px 0;font-size:14px;line-height:1.5;max-width:440px}.how p{color:var(--fg);margin:8px 0}.how b{color:var(--acc)}
.how-btn{font-size:16px;letter-spacing:1px;background:#1f5fa8;border-color:#3aa0ff}.how-btn:hover{background:#2a74c6}
.hint{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:12px;color:var(--mut);font-size:13px}
kbd{display:inline-block;min-width:20px;padding:2px 6px;margin:0 2px;border-radius:5px;background:#2a3442;border-bottom:3px solid #1a212b;color:var(--fg);font:600 12px system-ui;text-align:center}
</style></head><body>
<div id="wrap"><canvas id="c" width="900" height="600"></canvas>
<div id="ov"><div class="card" id="card"></div></div></div>
<div class="hint"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span><span>🖱️ Mouse aim · click / hold to shoot</span><span><kbd>Space</kbd> shoot (hold)</span><span><kbd>P</kbd> pause</span><span><kbd>Esc</kbd> menu</span><button id="mb" onclick="toggleMute()" style="padding:2px 10px;font-size:12px">🔊 Music (M)</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),card=document.getElementById('card');
const W=2700,H=1800,VW=900,VH=600,R=12;
const DIFF={Easy:{spread:.35,cd:1.6,spd:70,base:4,max:8},Normal:{spread:.2,cd:1.1,spd:95,base:6,max:12},Hard:{spread:.1,cd:.75,spd:120,base:8,max:16},Insane:{spread:.05,cd:.5,spd:150,base:10,max:20}};
const BOSS_TUNING={Easy:{hp:70,shotSpeed:350,firstCd:1.8,phase1:{move:55,strafe:28,count:2,spread:.28,cd:1.65},phase2:{move:72,strafe:40,count:3,spread:.30,cd:1.35}},Normal:{hp:100,shotSpeed:405,firstCd:1.5,phase1:{move:68,strafe:36,count:3,spread:.22,cd:1.3},phase2:{move:90,strafe:50,count:4,spread:.24,cd:.98}},Hard:{hp:225,shotSpeed:495,firstCd:1.15,phase1:{move:88,strafe:54,count:4,spread:.13,cd:.9},phase2:{move:120,strafe:78,count:6,spread:.16,cd:.68}},Insane:{hp:300,shotSpeed:560,firstCd:.9,phase1:{move:110,strafe:68,count:5,spread:.10,cd:.68},phase2:{move:150,strafe:95,count:7,spread:.12,cd:.48}}};
let diff='Normal',state='menu',mapChoice='Classic Field',playerWeapon='Pistol';
const MAPS={'Classic Field':{a:'#13261b',b:'#0f1f16',line:'rgba(255,255,255,.08)'},'Desert Arena':{a:'#80602d',b:'#6d5128',line:'rgba(255,238,180,.18)'},'Snow Base':{a:'#496d83',b:'#385b73',line:'rgba(225,247,255,.2)'}};
const GUNS={Pistol:{cd:.20,speed:560,pellets:1,spread:0,desc:'Balanced starter'},Rapid:{cd:.085,speed:610,pellets:1,spread:.035,desc:'Fast firing'},Scatter:{cd:.52,speed:490,pellets:5,spread:.34,desc:'Five-paintball burst'},Marksman:{cd:.72,speed:900,pellets:1,spread:.008,desc:'Long-range precision'}};
let unlocked={};try{unlocked=JSON.parse(localStorage.getItem('pb_achievements')||'{}')||{}}catch(e){}
const ACH=[['first','First Splash','Score your first elimination'],['ten','Paint Patrol','Score 10 eliminations'],['twentyfive','Paintball Pro','Score 25 eliminations'],['minute','One-Minute Survivor','Survive for 60 seconds'],['three','Three-Minute Legend','Survive for 180 seconds'],['collector','Power Collector','Collect 5 power-ups'],['arsenal','Full Arsenal','Try all 4 guns'],['boss','Boss Slayer','Defeat a BOSS']];
let powerupsCollected=0,usedGuns={};
function unlock(id){if(unlocked[id])return;unlocked[id]=true;try{localStorage.setItem('pb_achievements',JSON.stringify(unlocked))}catch(e){} }
function addKill(){kills++;if(kills>=1)unlock('first');if(kills>=10)unlock('ten');if(kills>=25)unlock('twentyfive')}
function chooseMap(m){mapChoice=m;menu()}
function chooseGun(g){playerWeapon=g;menu()}
const B0=[{x:130,y:150,w:90,h:30},{x:680,y:150,w:90,h:30},{x:405,y:110,w:90,h:34},{x:250,y:270,w:34,h:90},{x:616,y:270,w:34,h:90},{x:410,y:290,w:80,h:40},{x:130,y:430,w:90,h:30},{x:680,y:430,w:90,h:30},{x:395,y:470,w:110,h:30}];const B=[0,900,1800].flatMap(ox=>[0,600,1200].flatMap(oy=>B0.map(b=>({x:b.x+ox,y:b.y+oy,w:b.w,h:b.h}))));B.push({x:845,y:570,w:110,h:60},{x:1745,y:1170,w:110,h:60},{x:845,y:1170,w:110,h:60},{x:1745,y:570,w:110,h:60},{x:300,y:560,w:60,h:60},{x:1440,y:560,w:60,h:60},{x:2340,y:1160,w:60,h:60});
B.forEach(b=>{b.max=b.hp=20;b.holes=[];b.t=0});const B_BASE=B.map(b=>({x:b.x,y:b.y,w:b.w,h:b.h}));function applyMapLayout(){B.forEach((b,i)=>{const z=B_BASE[i];if(mapChoice==='Desert Arena'){b.x=W-z.x-z.w;b.y=H-z.y-z.h;b.w=z.w;b.h=z.h}else if(mapChoice==='Snow Base'){b.x=z.y/H*W;b.y=z.x/W*H;b.w=z.h/H*W;b.h=z.w/W*H}else{b.x=z.x;b.y=z.y;b.w=z.w;b.h=z.h}b.max=b.hp=20;b.holes=[];b.t=0})}let PA=[],camX=0,camY=0,U=[],UN=10,PU=[],tut=false,tstep=0,tshots=0;
const sp=document.createElement('canvas');sp.width=W;sp.height=H;const sx=sp.getContext('2d');
let P,E,T=[],balls,t,kills,keys={},mouse={x:450,y:300,down:false,active:false},last=0;
let boss=null,bossNext=45,bossBanner=0,bossNotice=0;
const best=d=>{try{return +localStorage.getItem('pb_best_'+d)||0}catch(e){return 0}};
const saveBest=(d,v)=>{try{localStorage.setItem('pb_best_'+d,v)}catch(e){}};
const fmt=s=>{const m=Math.floor(s/60);return m+':'+(s%60).toFixed(1).padStart(4,'0')};
function menu(){state='menu';ov.style.display='flex';
card.innerHTML=`<h1>🎯 Paintball Survival</h1><p>Survive with 5 lives and 5 green teammates on a huge map.<br>Pick a difficulty and beat your best time.</p>
<div class="diffs">${Object.keys(DIFF).map(d=>`<button class="${d==diff?'sel':''}" onclick="diff='${d}';menu()">${d}</button>`).join('')}</div>
<p class="lbl">🗺️ Choose a map</p><div class="row">${Object.keys(MAPS).map(m=>`<button class="${m==mapChoice?'sel':''}" onclick="chooseMap('${m}')">${m}</button>`).join('')}</div>
<p class="lbl">🔫 Choose your gun</p><div class="row">${Object.keys(GUNS).map(g=>`<button class="${g==playerWeapon?'sel':''}" onclick="chooseGun('${g}')">${g}</button>`).join('')}</div><small>${GUNS[playerWeapon].desc} · In game press 1–4 to switch</small>
<p class="lbl">🏆 Achievements (${ACH.filter(a=>unlocked[a[0]]).length}/${ACH.length})</p><div style="text-align:left;font-size:12px;line-height:1.7">${ACH.map(a=>`<div>${unlocked[a[0]]?'✅':'🔒'} <b>${a[1]}</b> — ${a[2]}</div>`).join('')}</div>
<p class="lbl">🏆 Best survival times</p><table>${Object.keys(DIFF).map(d=>`<tr class="${d==diff?'cur':''}"><td>${d}</td><td>${best(d)?fmt(best(d)):'—'}</td></tr>`).join('')}</table>
<div style="display:grid;gap:8px"><button class="how-btn" onclick="howto('menu')">❓ HOW TO PLAY</button><button class="go" onclick="start()">▶ Play · ${diff}</button><button onclick="start(true)">🎓 Tutorial (easy, slow-motion)</button></div><p><small>Got your own track (like a Kevin MacLeod MP3)? <label style="text-decoration:underline;cursor:pointer">Load it<input type="file" accept="audio/*" hidden onchange="loadTrack(this.files[0])"></label></small></p>`}
function start(tu){tut=tu===true;tstep=0;tshots=0;powerupsCollected=0;usedGuns={[playerWeapon]:true};boss=null;bossNext=tut?Infinity:45;bossBanner=0;bossNotice=0;keys={};if(AC&&!custom)newSong();applyMapLayout();B.forEach(b=>{b.hp=b.max;b.holes=[];b.t=0});PA=[];P={x:W/2,y:H-50,lives:5,shield:0,spd:0,inv:0,cd:0,hit:0,ang:-Math.PI/2};E=[];T=[];balls=[];t=0;kills=0;sx.clearRect(0,0,W,H);
const redMode=tut||diff==='Easy'||diff==='Normal',purpleMode=!tut&&(diff==='Hard'||diff==='Insane');const n=tut?0:(redMode?DIFF[diff].base:0);for(let i=0;i<n;i++)spawn();for(let i=0;i<(tut?2:5);i++)spawnT(i);U=[];UN=purpleMode?DIFF[diff].base:0;for(let i=0;i<UN;i++)spawnU();PU=[];if(tut)PU.push({x:W/2-140,y:H-130,k:'s',a:0},{x:W/2+140,y:H-130,k:'v',a:1});else for(let i=0;i<10;i++)spawnPU();state='play';ov.style.display='none'}
function howto(back){card.innerHTML=`<h2 style="color:var(--fg)">How to Play</h2><div class="how"><p><b>Goal:</b> survive as long as you can. You have <b>5 lives</b>. Your survival time is your score, and your best time is saved for each difficulty.</p><p><b>Boss fights:</b> A BOSS appears during survival rounds. Team up with your allies, keep moving, and watch the BOSS health bar at the top.</p><p><b>Move:</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys. <b>Aim:</b> move your mouse to point your gun at the cursor.</p><p><b>Shoot:</b> click and hold the left mouse button, or hold <kbd>Space</kbd>. Choose Pistol, Rapid, Scatter, or Marksman before a match; switch with <kbd>1</kbd>–<kbd>4</kbd>.</p><p><b>Other keys:</b> <kbd>P</kbd> pause · <kbd>M</kbd> mute music · <kbd>Esc</kbd> menu</p><p><b>Take cover:</b> hide behind the yellow bunkers to block paintballs. They get holes and break after 20 hits, then rebuild after a few seconds.</p><p><b>Teammates:</b> five green allies fight for you. If they get hit they’re out for 4 seconds, then return.</p><p><b>Getting hit:</b> each hit costs a life. You’re briefly protected (flashing) afterwards. Lose all 5 and you’re downed.</p><p><b>Power-ups:</b> grab the glowing 🛡️ <b>shields</b> (block every hit for 8s), ⚡ <b>speed potions</b> (run faster for 8s), and ❤️ <b>hearts</b> (restore 1 life, up to 5).</p><p><b>Enemy teams:</b> Red fighters spawn on Easy and Normal. Purple armored fighters spawn only on Hard and Insane; each takes 3 hits to eliminate, moves faster, and fires more accurately and often.</p><p><b>Maps:</b> choose Classic Field, Desert Arena, or Snow Base in the menu. Your selected map changes the arena ground and markings while keeping the original cover design.</p><p><b>Achievements:</b> earn medals for eliminations, survival time, and collecting power-ups. Progress is saved on this device.</p><p><b>Map:</b> the minimap (bottom right) shows bunkers, enemies (red) and allies (green). Red dots at the screen edge point to nearby enemies.</p></div><button class="go" onclick="${back}()">Got it</button>`}
function tutDone(){state='over';ov.style.display='flex';card.innerHTML=`<h2 style="color:#5ad1ff">Tutorial complete! 🎉</h2><p>You know the basics. Ready for the real thing?</p><div class="row"><button class="go" onclick="start()">Play ${diff}</button><button onclick="start(true)">Replay tutorial</button><button onclick="menu()">Menu</button></div>`}
function pause(){state='pause';ov.style.display='flex';card.innerHTML=`<h2 style="color:var(--fg)">Paused</h2><div class="row"><button class="go" onclick="resume()">Resume</button><button onclick="howto('pause')">How to play</button><button onclick="menu()">Menu</button></div><p><kbd>P</kbd> to resume</p>`}
function resume(){state='play';ov.style.display='none'}
function over(){state='over';const rec=t>best(diff);if(rec)saveBest(diff,t);ov.style.display='flex';
card.innerHTML=`<h2>YOU'RE DOWNED!</h2><div class="stats"><div class="stat"><b>${fmt(t)}</b><small>Survived</small></div><div class="stat"><b>${kills}</b><small>Eliminated</small></div><div class="stat"><b>${diff}</b><small>Difficulty</small></div></div>
${rec?'<p style="color:var(--acc)">🏆 New high score!</p>':`<p>Best: ${fmt(best(diff))}</p>`}<p>🔫 ${playerWeapon} · 🗺️ ${mapChoice}</p><p>🏅 Achievements unlocked: ${ACH.filter(a=>unlocked[a[0]]).length}/${ACH.length}</p>
<div class="row"><button class="go" onclick="start()">Restart</button><button onclick="menu()">Menu</button></div>`}
function inB(x,y,r){return B.some(b=>b.hp>0&&x>b.x-r&&x<b.x+b.w+r&&y>b.y-r&&y<b.y+b.h+r)}
function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.ceil(d/8);for(let i=1;i<n;i++){const k=i/n;if(inB(ax+(bx-ax)*k,ay+(by-ay)*k,0))return false}return true}
function spawnU(){let x,y;do{x=60+Math.random()*(W-120);y=60+Math.random()*(H-120)}while(inB(x,y,R)||Math.hypot(x-P.x,y-P.y)<500);U.push({x,y,hp:3,maxHp:3,flash:0,mode:'hold',tx:x,ty:y,t:1+Math.random(),cd:.35+Math.random()*.35,peek:false,ang:0})}
function spawnPU(){let x,y;do{x=60+Math.random()*(W-120);y=60+Math.random()*(H-120)}while(inB(x,y,R+10)||PU.some(o=>Math.hypot(o.x-x,o.y-y)<250));PU.push({x,y,k:(()=>{const r=Math.random();return r<.34?'s':r<.68?'v':'h'})(),a:Math.random()*6})}
function spawnT(i){T.push({x:W/2-120+i*60,y:H-30,mode:'hold',tx:0,ty:0,t:1,cd:1,peek:false,down:0,ang:-Math.PI/2})}
function spawn(){const s=Math.random();let x,y;do{x=40+Math.random()*(W-80);y=40+Math.random()*(H-80)}while(inB(x,y,R)||(P&&Math.hypot(x-P.x,y-P.y)<700)||E.some(o=>Math.hypot(o.x-x,o.y-y)<150));
E.push({x,y,mode:'move',tx:x,ty:y+60,t:3,cd:1+Math.random(),peek:false,tr:0})}
function spawnBoss(){
 let x=P.x,y=Math.max(70,P.y-600),ok=false;
 for(let i=0;i<180;i++){
  const a=Math.random()*Math.PI*2,d=520+Math.random()*180;
  const tx=Math.max(70,Math.min(W-70,P.x+Math.cos(a)*d));
  const ty=Math.max(70,Math.min(H-70,P.y+Math.sin(a)*d));
  if(!inB(tx,ty,34)&&Math.hypot(tx-P.x,ty-P.y)>420){x=tx;y=ty;ok=true;break}
 }
 if(!ok){x=Math.max(70,Math.min(W-70,P.x));y=Math.max(70,Math.min(H-70,P.y-520));}
 const tune=BOSS_TUNING[diff],hp=tune.hp;
 boss={name:'BOSS',x,y,r:32,hp,maxHp:hp,ang:Math.atan2(P.y-y,P.x-x),cd:tune.firstCd,flash:0,phase:1,strafe:Math.random()<.5?-1:1};
 bossBanner=3.2;
}
function defeatBoss(){
 if(!boss)return;
 for(let i=0;i<38;i++)PA.push({x:boss.x,y:boss.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,l:.8+Math.random()*.8,s:4+Math.random()*7,c:['#ff4f79','#ffd23a','#b45cff','#5ad1ff'][i%4]});
 boss=null;bossNext=t+75;bossNotice=3;unlock('boss');addKill();
}
function pick(wantLos,tg=P){for(let i=0;i<40;i++){const al=B.filter(q=>q.hp>0&&Math.hypot(q.x-tg.x,q.y-tg.y)<700),b=al[Math.random()*al.length|0],a=Math.random()*6.283;if(!b)break;
const x=Math.max(20,Math.min(W-20,b.x+b.w/2+Math.cos(a)*(b.w/2+22))),y=Math.max(20,Math.min(H-20,b.y+b.h/2+Math.sin(a)*(b.h/2+22)));
if(inB(x,y,R))continue;if(los(x,y,tg.x,tg.y)==wantLos)return{x,y}}return{x:Math.max(20,Math.min(W-20,tg.x+(Math.random()-.5)*500)),y:Math.max(20,Math.min(H-20,tg.y+(Math.random()-.5)*500))}}
function push(o){B.forEach(b=>{if(b.hp<=0)return;const cx=Math.max(b.x,Math.min(o.x,b.x+b.w)),cy=Math.max(b.y,Math.min(o.y,b.y+b.h));let dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);
if(d<R){if(d==0){dx=0;dy=-1;d=1}o.x=cx+dx/d*R;o.y=cy+dy/d*R}});o.x=Math.max(R,Math.min(W-R,o.x));o.y=Math.max(R,Math.min(H-R,o.y))}
function shoot(o,ang,own){const speed=own=='p'?560:own=='u'?490:own=='boss'?BOSS_TUNING[diff].shotSpeed:400;balls.push({x:o.x+Math.cos(ang)*16,y:o.y+Math.sin(ang)*16,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,own})}
function shootPlayer(){const g=GUNS[playerWeapon];for(let i=0;i<g.pellets;i++){const a=P.ang+(Math.random()-.5)*g.spread;balls.push({x:P.x+Math.cos(a)*16,y:P.y+Math.sin(a)*16,vx:Math.cos(a)*g.speed,vy:Math.sin(a)*g.speed,own:'p'})}P.cd=g.cd;tshots++;usedGuns[playerWeapon]=true;if(Object.keys(usedGuns).length===4)unlock('arsenal')}
function dmg(bk,b){bk.hp--;if(bk.holes.length<40)bk.holes.push({x:Math.max(3,Math.min(bk.w-3,b.x-bk.x)),y:Math.max(3,Math.min(bk.h-3,b.y-bk.y)),r:2+Math.random()*2.5,cx:(Math.random()-.5)*16,cy:(Math.random()-.5)*16});
for(let i=0;i<3;i++)PA.push({x:b.x,y:b.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,l:.4,s:2+Math.random()*2,c:'#f0cf3a'});

function pos(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*VW/r.width;mouse.y=(e.clientY-r.top)*VH/r.height;mouse.active=true}

let AC,master,nb,muted=false,step=0,nextT=0,custom=null;
let CH,SP=.107,ARP=[0,1,2,1],WV='square',BW='sawtooth',KP,SN,BP,HT=2,OC=4;
function newSong(){const pk=a=>a[Math.random()*a.length|0],rt=pk([98,110,116.54,123.47,130.81,146.83]),mi=[0,3,7],ma=[0,4,7];
const pr=pk([[[0,mi],[-4,ma],[3,ma],[-2,ma]],[[0,mi],[5,mi],[-4,ma],[-2,ma]],[[0,ma],[-3,mi],[-7,ma],[-5,ma]],[[0,mi],[-2,ma],[-4,ma],[-5,mi]],[[0,mi],[3,ma],[-2,ma],[-4,ma]]]);
CH=pr.map(([n,iv])=>[rt*Math.pow(2,n/12),iv.map(x=>Math.pow(2,x/12))]);
SP=60/(110+Math.random()*55|0)/4;ARP=pk([[0,1,2,1],[0,2,1,2],[2,1,0,1],[0,0,1,2],[0,1,2,0,2,1]]);
WV=pk(['square','triangle','sawtooth']);BW=pk(['sawtooth','square','triangle']);OC=pk([2,4,4,8]);HT=pk([1,2,2]);
KP=pk(['1000100010001000','1000001010001010','1001100010011000']);SN=pk(['0000100000001000','0000000010000000','0000100000001010']);BP=pk(['1010101010101010','1001001010010010','1011101010111010','1000100110001001']);step=0}
function tone(f,t,d,ty,v,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d)}
function hit(t,d,v){const s=AC.createBufferSource(),g=AC.createGain(),h=AC.createBiquadFilter();s.buffer=nb;h.type='highpass';h.frequency.value=6000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(h);h.connect(g);g.connect(master);s.start(t);s.stop(t+d)}
function sched(){if(custom)return;while(nextT<AC.currentTime+.25){const bar=(step>>4)%4,s=step%16,[r,iv]=CH[bar];
if(KP[s]=='1')tone(150,nextT,.15,'sine',.5,40);if(SN[s]=='1')hit(nextT,.14,.25);else if(s%HT==0)hit(nextT,.04,.1);

function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.45;master.connect(AC.destination);

function loadTrack(f){if(!f)return;initAudio();if(custom)custom.pause();custom=new Audio(URL.createObjectURL(f));custom.loop=true;custom.volume=.5;custom.muted=muted;custom.play().catch(()=>{custom=null;if(AC)nextT=AC.currentTime+.1})}
